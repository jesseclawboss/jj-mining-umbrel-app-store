services:
  app_proxy:
    environment:
      APP_HOST: jjmining-dogecoin-node_dashboard_1
      APP_PORT: "8080"
  dogecoin:
    container_name: jjmining-dogecoin-node_dogecoin_1
    image: ghcr.io/jesseclawboss/jj-mining-dogecoin-core:1.14.9-2
    user: "0:0"
    environment:
      DAEMON: dogecoind
      CONF_NAME: dogecoin.conf
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/config:/config
      - ${APP_DATA_DIR}/secrets:/secrets
    ports:
      - "22556:22556/tcp"
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "dogecoin-cli -datadir=/data -conf=/config/dogecoin.conf getblockchaininfo >/dev/null"]
      interval: 30s
      timeout: 10s
      start_period: 2m
      retries: 5
  dashboard:
    image: ghcr.io/jesseclawboss/jj-mining-node-dashboard:1.1.0
    user: "0:0"
    environment:
      COIN: Dogecoin
      RPC_HOST: jjmining-dogecoin-node_dogecoin_1
      RPC_PORT: "22555"
    depends_on:
      dogecoin: {condition: service_started}
    volumes:
      - ${APP_DATA_DIR}/secrets:/run/jjmining:ro
      - ${APP_DATA_DIR}/data:/data:ro
    restart: unless-stopped
    init: true
