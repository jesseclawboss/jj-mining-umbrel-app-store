services:
  app_proxy:
    environment:
      APP_HOST: jjmining-ltc-doge-p2pool_dashboard_1
      APP_PORT: "8080"
  litecoin:
    container_name: jjmining-ltc-doge-p2pool_litecoin_1
    image: ghcr.io/jesseclawboss/jj-mining-litecoin-core:0.21.5.6-2
    user: "0:0"
    environment: {DAEMON: litecoind, CONF_NAME: litecoin.conf, SECRET_NAME: litecoin.env}
    volumes: ["${APP_DATA_DIR}/data/litecoin:/data", "${APP_DATA_DIR}/config:/config", "${APP_DATA_DIR}/secrets:/secrets"]
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "litecoin-cli -datadir=/data -conf=/config/litecoin.conf getblockchaininfo >/dev/null"]
      interval: 30s
      timeout: 10s
      start_period: 2m
      retries: 5
  dogecoin:
    container_name: jjmining-ltc-doge-p2pool_dogecoin_1
    image: ghcr.io/jesseclawboss/jj-mining-dogecoin-core:1.14.9-2
    user: "0:0"
    environment: {DAEMON: dogecoind, CONF_NAME: dogecoin.conf, SECRET_NAME: dogecoin.env}
    volumes: ["${APP_DATA_DIR}/data/dogecoin:/data", "${APP_DATA_DIR}/config:/config", "${APP_DATA_DIR}/secrets:/secrets"]
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "dogecoin-cli -datadir=/data -conf=/config/dogecoin.conf getblockchaininfo >/dev/null"]
      interval: 30s
      timeout: 10s
      start_period: 2m
      retries: 5
  mm-adapter:
    container_name: jjmining-ltc-doge-p2pool_mm-adapter_1
    image: ghcr.io/jesseclawboss/jj-mining-mm-adapter:44a10f3-2
    user: "0:0"
    depends_on: {dogecoin: {condition: service_started}}
    volumes: ["${APP_DATA_DIR}/config:/config", "${APP_DATA_DIR}/secrets:/secrets:ro"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:44556/', timeout=2)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
  p2pool:
    container_name: jjmining-ltc-doge-p2pool_p2pool_1
    image: ghcr.io/jesseclawboss/jj-mining-p2pool:44a10f3-solo5
    user: "0:0"
    platform: linux/amd64
    depends_on: {litecoin: {condition: service_started}, dogecoin: {condition: service_started}, mm-adapter: {condition: service_started}}
    volumes: ["${APP_DATA_DIR}/data/solo:/app/data", "${APP_DATA_DIR}/config:/config:ro", "${APP_DATA_DIR}/secrets:/secrets:ro"]
    ports: ["9327:9327/tcp"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pypy", "-c", "import urllib2; urllib2.urlopen('http://127.0.0.1:9327/local_stats', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 2m
      retries: 5
  dashboard:
    container_name: jjmining-ltc-doge-p2pool_dashboard_1
    image: ghcr.io/jesseclawboss/jj-mining-merged-dashboard:0.4.0
    user: "0:0"
    depends_on: {litecoin: {condition: service_started}, dogecoin: {condition: service_started}}
    environment:
      LITECOIN_RPC_HOST: jjmining-ltc-doge-p2pool_litecoin_1
      DOGECOIN_RPC_HOST: jjmining-ltc-doge-p2pool_dogecoin_1
      P2POOL_HOST: jjmining-ltc-doge-p2pool_p2pool_1
    volumes: ["${APP_DATA_DIR}/config:/config", "${APP_DATA_DIR}/secrets:/secrets:ro"]
    restart: unless-stopped
    init: true
