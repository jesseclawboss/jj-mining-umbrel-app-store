services:
  app_proxy:
    environment:
      APP_HOST: jjmining-ltc-doge-p2pool_dashboard_1
      APP_PORT: "8080"
  init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    command: ["/bin/sh", "/opt/jj/init.sh"]
    volumes:
      - ./runtime/init.sh:/opt/jj/init.sh:ro
      - ${APP_DATA_DIR}/secrets:/secrets
      - ${APP_DATA_DIR}/config:/config
      - ${APP_DATA_DIR}/data:/data
    restart: "no"
  litecoin:
    image: ghcr.io/jesseclawboss/jj-mining-litecoin-core:0.21.5.6-1
    user: "0:0"
    environment: {DAEMON: litecoind, CONF_NAME: litecoin.conf}
    depends_on: {init: {condition: service_completed_successfully}}
    volumes: ["${APP_DATA_DIR}/data/litecoin:/data", "${APP_DATA_DIR}/config:/config:ro"]
    ports: ["9333:9333/tcp"]
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "litecoin-cli -datadir=/data -conf=/config/litecoin.conf getblockchaininfo >/dev/null"]
      interval: 30s
      timeout: 10s
      start_period: 2m
      retries: 5
  dogecoin:
    image: ghcr.io/jesseclawboss/jj-mining-dogecoin-core:1.14.9-1
    user: "0:0"
    environment: {DAEMON: dogecoind, CONF_NAME: dogecoin.conf}
    depends_on: {init: {condition: service_completed_successfully}}
    volumes: ["${APP_DATA_DIR}/data/dogecoin:/data", "${APP_DATA_DIR}/config:/config:ro"]
    ports: ["22556:22556/tcp"]
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "dogecoin-cli -datadir=/data -conf=/config/dogecoin.conf getblockchaininfo >/dev/null"]
      interval: 30s
      timeout: 10s
      start_period: 2m
      retries: 5
  mm-adapter:
    image: ghcr.io/jesseclawboss/jj-mining-mm-adapter:44a10f3-1
    user: "0:0"
    depends_on: {init: {condition: service_completed_successfully}, dogecoin: {condition: service_started}}
    volumes: ["${APP_DATA_DIR}/config:/config:ro"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:44556/', timeout=2)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
  p2pool:
    image: ghcr.io/jesseclawboss/jj-mining-p2pool:44a10f3-1
    user: "0:0"
    platform: linux/amd64
    depends_on: {litecoin: {condition: service_started}, dogecoin: {condition: service_started}, mm-adapter: {condition: service_started}}
    volumes: ["${APP_DATA_DIR}/data/p2pool:/app/data", "${APP_DATA_DIR}/config:/config:ro", "${APP_DATA_DIR}/secrets:/secrets:ro"]
    ports: ["9327:9327/tcp", "9326:9326/tcp"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pypy", "-c", "import urllib2; urllib2.urlopen('http://127.0.0.1:9327/local_stats', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 2m
      retries: 5
  dashboard:
    image: ghcr.io/jesseclawboss/jj-mining-merged-dashboard:0.2.0
    user: "0:0"
    depends_on: {init: {condition: service_completed_successfully}}
    volumes: ["${APP_DATA_DIR}/config:/config", "${APP_DATA_DIR}/secrets:/secrets:ro"]
    restart: unless-stopped
    init: true
