services:
  app_proxy:
    environment:
      APP_HOST: jjmining-litecoin-node_dashboard_1
      APP_PORT: "8080"
  init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    command: ["/bin/sh", "/opt/jj/init.sh"]
    environment:
      CONF_NAME: litecoin.conf
    volumes:
      - ./runtime/init.sh:/opt/jj/init.sh:ro
      - ${APP_DATA_DIR}/secrets:/secrets
      - ${APP_DATA_DIR}/config:/config
      - ${APP_DATA_DIR}/data:/data
    restart: "no"
  litecoin:
    image: ghcr.io/jesseclawboss/jj-mining-litecoin-core:0.21.5.6-1
    user: "0:0"
    environment:
      DAEMON: litecoind
      CONF_NAME: litecoin.conf
    depends_on:
      init: {condition: service_completed_successfully}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/config:/config:ro
    ports:
      - "9333:9333/tcp"
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "litecoin-cli -datadir=/data -conf=/config/litecoin.conf getblockchaininfo >/dev/null"]
      interval: 30s
      timeout: 10s
      start_period: 2m
      retries: 5
  dashboard:
    image: ghcr.io/jesseclawboss/jj-mining-node-dashboard:1.1.0
    user: "0:0"
    environment:
      COIN: Litecoin
      RPC_HOST: litecoin
      RPC_PORT: "9332"
    depends_on:
      init: {condition: service_completed_successfully}
    volumes:
      - ${APP_DATA_DIR}/secrets:/run/jjmining:ro
      - ${APP_DATA_DIR}/data:/data:ro
    restart: unless-stopped
    init: true
