<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JJ {{COIN}} Node</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui;background:#090b10;color:#eef2ff}*{box-sizing:border-box}body{margin:0;padding:28px}.wrap{max-width:980px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:20px}.badge{padding:8px 13px;border-radius:999px;background:#252a36;text-transform:capitalize}.healthy{color:#68e6a0}.syncing,.starting{color:#f7ca62}.degraded{color:#ff9d66}.offline{color:#ff6978}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:26px}.card{background:#121620;border:1px solid #262c3a;border-radius:18px;padding:20px}.label{color:#929cb2;font-size:13px}.value{font-size:25px;font-weight:650;margin-top:8px;overflow-wrap:anywhere}.wide{grid-column:1/-1}.bar{height:10px;background:#252b38;border-radius:9px;overflow:hidden;margin-top:14px}.fill{height:100%;background:linear-gradient(90deg,#5577ff,#64e4b1)}footer{color:#7f899f;margin-top:24px;font-size:13px}@media(max-width:500px){body{padding:18px}.head{align-items:flex-start;flex-direction:column}.value{font-size:21px}}</style></head><body><main class="wrap"><div class="head"><div><div class="label">JJ MINING</div><h1>{{COIN}} Node</h1></div><div id="badge" class="badge starting">Starting</div></div><p id="message">Dashboard is online. Waiting for node RPC…</p><section class="grid"><div class="card wide"><div class="label">Synchronization</div><div class="value" id="progress">—</div><div class="bar"><div id="fill" class="fill" style="width:0"></div></div></div><div class="card"><div class="label">Blocks</div><div id="blocks" class="value">—</div></div><div class="card"><div class="label">Headers</div><div id="headers" class="value">—</div></div><div class="card"><div class="label">Peers</div><div id="peers" class="value">—</div></div><div class="card"><div class="label">RPC</div><div id="rpc" class="value">Waiting</div></div><div class="card"><div class="label">Chain</div><div id="chain" class="value">—</div></div><div class="card"><div class="label">Version</div><div id="version" class="value">—</div></div><div class="card"><div class="label">Blockchain disk usage</div><div id="disk" class="value">—</div></div></section><footer>RPC is private to this app. Statistics come directly from the local node and are never simulated.</footer></main><script>
const f=(n)=>n==null?'—':Number(n).toLocaleString(), bytes=n=>n==null?'—':(n/1073741824).toFixed(1)+' GiB';async function update(){try{let d=await fetch('api/status',{cache:'no-store'}).then(r=>r.json());badge.textContent=d.state;badge.className='badge '+d.state;message.textContent=d.message;progress.textContent=d.progress==null?'—':d.progress.toFixed(2)+'%';fill.style.width=(d.progress||0)+'%';blocks.textContent=f(d.blocks);headers.textContent=f(d.headers);peers.textContent=f(d.peers);rpc.textContent=d.rpc?'Available':'Unavailable';chain.textContent=d.chain||'—';version.textContent=d.version||'—';disk.textContent=bytes(d.disk_used)}catch(e){badge.textContent='offline';badge.className='badge offline';message.textContent='Dashboard API unavailable'}}update();setInterval(update,5000)</script></body></html>
